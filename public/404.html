<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>404 — Halaman Tidak Ditemukan | LPPM Unila</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        color: #111827;
        background:
          radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.14), transparent 28rem),
          radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.12), transparent 30rem),
          linear-gradient(135deg, #eff6ff 0%, #ffffff 48%, #eef2ff 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .card {
        width: 100%;
        max-width: 38rem;
        padding: 3rem 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(191, 219, 254, 0.8);
        border-radius: 1.5rem;
        box-shadow: 0 25px 60px rgba(15, 55, 100, 0.14);
        backdrop-filter: blur(12px);
      }

      .logo {
        width: auto;
        height: 4.25rem;
        max-width: 16rem;
        margin: 0 auto 2rem;
        object-fit: contain;
      }

      .icon {
        display: flex;
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        align-items: center;
        justify-content: center;
        color: #105091;
        background: #dbeafe;
        border-radius: 9999px;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #2563eb;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.2;
      }

      .description {
        max-width: 29rem;
        margin: 1rem auto 0;
        color: #4b5563;
        font-size: 1rem;
        line-height: 1.7;
      }

      .home-link {
        display: inline-flex;
        margin-top: 2rem;
        align-items: center;
        gap: 0.6rem;
        padding: 0.85rem 1.4rem;
        color: #ffffff;
        background: linear-gradient(90deg, #105091, #2563eb);
        border-radius: 0.75rem;
        box-shadow: 0 12px 24px rgba(16, 80, 145, 0.22);
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .home-link:hover,
      .home-link:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(16, 80, 145, 0.28);
      }

      .home-link:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 4px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.25rem;
        }

        .logo {
          height: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <img class="logo" src="/logo-lppm-unila.png" alt="LPPM Universitas Lampung" />
        <div class="icon" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
            <path d="m8.5 8.5 5 5"></path>
            <path d="m13.5 8.5-5 5"></path>
          </svg>
        </div>
        <p class="eyebrow">Error 404</p>
        <h1 id="page-title">Halaman tidak ditemukan</h1>
        <p class="description">
          Alamat yang Anda buka tidak tersedia, sudah dipindahkan, atau mungkin tidak pernah ada.
        </p>
        <a class="home-link" href="/">
          <span aria-hidden="true">&#8592;</span>
          Kembali ke Beranda
        </a>
      </section>
    </main>
  </body>
</html>
